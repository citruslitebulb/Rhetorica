<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Rhetorica — first-run onboarding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #D4AF37;
      --gold-soft: #FFEBA4;
      --primary-container: #4A3B18;
      --bg: #1A1A1A;
      --surface: #121212;
      --surface-variant: #2B2B2B;
      --on-bg: #EAEAEA;
      --muted: #B3B3B3;
      --error: #E8A0A0;
      --outline: #3A3A3A;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Roboto", system-ui, sans-serif;
      background: #0C0C0C;
      color: var(--on-bg);
    }

    .board {
      min-height: 100vh;
      padding: 36px 40px 48px;
    }
    .board-header {
      margin-bottom: 28px;
    }
    .board-kicker {
      color: var(--gold);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 600;
      margin: 0 0 8px;
    }
    .board-title {
      font-family: "Fraunces", Georgia, serif;
      font-size: 34px;
      font-weight: 700;
      margin: 0 0 6px;
    }
    .board-sub {
      color: var(--muted);
      margin: 0;
      font-size: 15px;
      max-width: 720px;
      line-height: 1.45;
    }
    .phones {
      display: flex;
      gap: 22px;
      align-items: flex-start;
    }
    .phone-wrap { width: 320px; flex: 0 0 320px; }
    .caption {
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .caption strong { color: var(--gold-soft); font-weight: 600; }

    .device {
      width: 320px;
      height: 692px;
      background: #111;
      border-radius: 34px;
      padding: 10px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45), inset 0 0 0 1px #2a2a2a;
    }
    .screen {
      width: 100%;
      height: 100%;
      background: var(--bg);
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .status {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px 0;
      font-size: 11px;
      color: #ddd;
      font-weight: 500;
    }
    .status .icons { letter-spacing: 3px; font-size: 10px; }

    .app {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 8px 16px 14px;
      min-height: 0;
    }
    .step {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 6px;
    }
    .progress {
      height: 4px;
      background: #2F2F2F;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress > span {
      display: block;
      height: 100%;
      background: var(--gold);
      border-radius: 99px;
    }

    .content { flex: 1; min-height: 0; overflow: hidden; }
    h1.wordmark {
      font-family: "Fraunces", Georgia, serif;
      font-size: 34px;
      color: var(--gold);
      margin: 8px 0 6px;
      text-align: center;
      font-weight: 700;
    }
    .tagline {
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      margin: 0 0 12px;
    }
    .body {
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.45;
      margin: 0 0 10px;
    }
    .center { text-align: center; }
    .headline {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 8px;
      line-height: 1.2;
    }

    .logo-wrap {
      width: 92px;
      height: 92px;
      margin: 8px auto 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-wrap svg {
      width: 72px;
      height: 72px;
      filter: drop-shadow(0 0 12px rgba(212,175,55,0.28));
    }

    .nav {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .btn {
      flex: 1;
      border: 0;
      border-radius: 20px;
      height: 36px;
      font: 500 13px "Roboto", sans-serif;
      cursor: default;
    }
    .btn-filled { background: var(--gold); color: #111; }
    .btn-outline {
      background: transparent;
      color: var(--gold);
      box-shadow: inset 0 0 0 1px var(--gold);
    }
    .btn-wide { width: 100%; }

    .section-label {
      font-size: 13px;
      font-weight: 600;
      margin: 10px 0 4px;
    }
    .card {
      background: var(--surface-variant);
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 6px;
    }
    .card.selected {
      background: var(--primary-container);
    }
    .card-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .card-title { font-size: 13.5px; font-weight: 600; margin: 0 0 3px; }
    .card-body { font-size: 11px; color: var(--muted); margin: 0 0 4px; line-height: 1.35; }
    .card.selected .card-body { color: var(--gold-soft); opacity: 0.85; }
    .meta { font-size: 10.5px; color: var(--gold); font-weight: 500; }
    .check {
      width: 18px; height: 18px; flex: 0 0 18px; margin-top: 2px; color: var(--gold);
    }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      background: transparent;
      color: var(--on-bg);
      box-shadow: inset 0 0 0 1px #5A5A5A;
    }
    .chip.on {
      background: var(--primary-container);
      color: var(--gold-soft);
      box-shadow: inset 0 0 0 1px var(--gold);
    }

    .group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 2px 0 6px;
    }
    .group-head h3 { font-size: 12.5px; margin: 0; font-weight: 600; }
    .link {
      color: var(--gold);
      font-size: 11.5px;
      font-weight: 500;
    }

    .orator {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 12px;
      background: var(--primary-container);
      margin-bottom: 7px;
    }
    .orator.off { background: var(--surface-variant); }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(160deg, #5C2D2D, #2A1B00);
      color: var(--gold-soft);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
      flex: 0 0 36px;
      box-shadow: inset 0 0 0 1px rgba(212,175,55,0.35);
    }
    .orator .name { font-size: 13.5px; font-weight: 600; }
    .orator .era { font-size: 10.5px; color: var(--muted); margin-top: 1px; }

    .habit-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 16px 0 14px;
    }
    .switch {
      width: 42px; height: 24px; border-radius: 99px;
      background: var(--gold);
      position: relative; flex: 0 0 42px;
    }
    .switch::after {
      content: "";
      width: 18px; height: 18px; border-radius: 50%;
      background: #111;
      position: absolute; top: 3px; right: 3px;
    }

    .welcome-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 28px;
    }

    body.solo { background: #000; }
    body.solo .board { display: none; }
    body.solo .solo-phone {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .solo-phone { display: none; }
    body.solo .device {
      width: 390px;
      height: 844px;
      border-radius: 40px;
      padding: 12px;
    }
    body.solo .screen { border-radius: 28px; }
    body.solo .headline { font-size: 24px; }
    body.solo h1.wordmark { font-size: 42px; }
    body.solo .body { font-size: 15px; }
    body.solo .card-title { font-size: 15px; }
    body.solo .card-body { font-size: 12.5px; }
    body.solo .btn { height: 42px; font-size: 14px; }
    body.solo .app { padding: 10px 20px 18px; }
  </style>
</head>
<body>
  <section class="board">
    <header class="board-header">
      <p class="board-kicker">Rhetorica · first launch</p>
      <h1 class="board-title">Onboarding questionnaire</h1>
      <p class="board-sub">Three screens. Classical philosophers start selected. Individual orators can be skipped later in Settings.</p>
    </header>
    <div class="phones">
      <div class="phone-wrap">
        <div class="device" data-screen="1"></div>
        <p class="caption"><strong>1 · Welcome</strong></p>
      </div>
      <div class="phone-wrap">
        <div class="device" data-screen="2"></div>
        <p class="caption"><strong>2 · Interests</strong> — voices + optional themes</p>
      </div>
      <div class="phone-wrap">
        <div class="device" data-screen="3"></div>
        <p class="caption"><strong>3 · Habit</strong> — then Begin</p>
      </div>
    </div>
  </section>
  <div class="solo-phone"><div class="device" id="solo-device"></div></div>

  <script>
    const check = `<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 13l4 4L19 7"/></svg>`;

    function shell(step, total, fill, inner, nav) {
      return `
        <div class="screen">
          <div class="status"><span>9:41</span><span class="icons">●●●  LTE  84%</span></div>
          <div class="app">
            <div class="step">Step ${step} of ${total}</div>
            <div class="progress"><span style="width:${fill}%"></span></div>
            <div class="content">${inner}</div>
            ${nav}
          </div>
        </div>`;
    }

    const screens = {
      1: shell(1, 3, 33, `
        <div class="welcome-stack">
          <div class="logo-wrap" aria-hidden="true">
            <svg viewBox="0 0 64 96" fill="none">
              <rect x="14" y="8" width="36" height="8" rx="1.5" fill="#D4AF37"/>
              <rect x="18" y="16" width="28" height="6" rx="1" fill="#C4A056"/>
              <rect x="22" y="24" width="4" height="50" fill="#C9A44A"/>
              <rect x="28" y="24" width="3.5" height="50" fill="#E0C36A"/>
              <rect x="34" y="24" width="3.5" height="50" fill="#C9A44A"/>
              <rect x="40" y="24" width="4" height="50" fill="#B48B3A"/>
              <rect x="18" y="74" width="28" height="6" rx="1" fill="#C4A056"/>
              <rect x="12" y="82" width="40" height="8" rx="1.5" fill="#D4AF37"/>
            </svg>
          </div>
          <h1 class="wordmark">Rhetorica</h1>
          <p class="tagline">Daily words that moved empires</p>
          <p class="body center">Rhetorica is a daily ritual of rhetorical language drawn from history’s great speeches. One word each day. Offline. Yours.</p>
          <p class="body center">A few questions first, so the feed is built around the voices you actually want — not every orator in the catalog.</p>
        </div>
      `, `<div class="nav"><button class="btn btn-filled btn-wide">Continue</button></div>`),

      2: shell(2, 3, 66, `
        <p class="headline">What are you looking for?</p>
        <p class="body">Choose the voices that belong in your daily feed. Classical philosophers are selected to start. Skip or add individual orators later in Settings.</p>
        <div class="card selected">
          <div class="card-row">
            <div>
              <p class="card-title">Classical philosophers &amp; orators</p>
              <p class="card-body">Ancient persuasion and Stoic reflection — Demosthenes, Cicero, Marcus Aurelius.</p>
              <p class="meta">5 voices</p>
            </div>
            ${check}
          </div>
        </div>
        <div class="card">
          <p class="card-title">Historical statesmen</p>
          <p class="card-body">Civic speech that shaped nations — Lincoln, Churchill, the founding generation.</p>
          <p class="meta">13 voices</p>
        </div>
        <div class="card">
          <p class="card-title">Justice &amp; human rights</p>
          <p class="card-body">Dignity, rights, and moral courage — Douglass, King, Mandela.</p>
          <p class="meta">12 voices</p>
        </div>
        <p class="section-label">Narrow by theme</p>
        <p class="body">Optional. Leave this on All themes to keep every theme from the voices you chose.</p>
        <div class="chips">
          <span class="chip on">All themes</span>
          <span class="chip">Inspirational</span>
          <span class="chip">Tech</span>
          <span class="chip">Humanities</span>
          <span class="chip">Arts</span>
          <span class="chip">Leadership</span>
          <span class="chip">Democracy</span>
          <span class="chip">Courage</span>
          <span class="chip">Legacy</span>
        </div>
      `, `<div class="nav"><button class="btn btn-outline">Back</button><button class="btn btn-filled">Continue</button></div>`),

      3: shell(3, 3, 100, `
        <p class="headline">Make it a habit</p>
        <p class="body">A daily notification and home-screen widget keep today’s word in reach.</p>
        <div class="habit-row">
          <div>
            <div style="font-size:15px;font-weight:500">Daily notification</div>
            <div class="era" style="margin-top:4px">08:00</div>
          </div>
          <div class="switch"></div>
        </div>
        <button class="btn btn-outline btn-wide">Add Word of the Day widget</button>
      `, `<div class="nav"><button class="btn btn-outline">Back</button><button class="btn btn-filled">Begin</button></div>`)
    };

    document.querySelectorAll(".device[data-screen]").forEach((el) => {
      el.innerHTML = screens[el.dataset.screen];
    });

    const params = new URLSearchParams(location.search);
    const page = params.get("p");
    if (page && screens[page]) {
      document.body.classList.add("solo");
      document.getElementById("solo-device").innerHTML = screens[page];
    }
  </script>
</body>
</html>
